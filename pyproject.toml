[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-lab"
version = "1.0.0"
description = "LLM serving experiments: dynamic batching and request coalescing in front of OpenAI-compatible servers, a semantic cache evaluated for wrong answers, and a simulation of static vs continuous batching."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yixuan Zhang"}]
dependencies = ["fastapi>=0.110", "httpx>=0.27", "pydantic>=2.6", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]
neural = ["sentence-transformers>=2.7"]
figures = ["matplotlib>=3.7"]

[project.scripts]
inference-bench = "inference_lab.benchmark:main"
inference-lab = "inference_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
